name: Daily TQQQ call

on:
  schedule:
    # 21:00 UTC Sun-Thu = ~8am Melbourne Mon-Fri (7am before daylight saving).
    # Monday's run uses Friday's US close; Tue-Fri use the previous night's close.
    - cron: "0 21 * * 0-4"
  workflow_dispatch:
    inputs:
      position:
        description: "Override current position (leave blank to infer from log)"
        required: false
        type: choice
        options: ["", "IN", "OUT"]

permissions:
  contents: write   # lets the job commit the updated log back to the repo
  issues: write     # lets the job post each call as an issue (public record)

jobs:
  call:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Make the call
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          POSITION: ${{ inputs.position }}
          PYTHONUNBUFFERED: "1"   # show log lines as they happen
        run: python tqqq_call.py

      - name: Save log
        run: |
          git config user.name "tqqq-bot"
          git config user.email "tqqq-bot@users.noreply.github.com"
          git add tqqq_calls.csv
          git commit -m "Call $(date -u +%Y-%m-%d)" || echo "Nothing to commit"
          git push

      - name: Post call as issue
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh label create daily-call --color 1f6feb --description "Automated daily TQQQ call" --force
          gh issue create --title "$(cat alert_title.txt)" --body-file alert_body.md --label daily-call

      - name: Email the call
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
        run: |
          jq -n --arg to "$EMAIL_TO" --rawfile subject alert_title.txt --rawfile text alert_body.md \
            '{from: "TQQQ Bot <onboarding@resend.dev>", to: [$to], subject: $subject, text: $text}' \
          | curl -sS --fail-with-body https://api.resend.com/emails \
              -H "Authorization: Bearer $RESEND_API_KEY" \
              -H "Content-Type: application/json" \
              -d @-